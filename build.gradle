plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"armageddon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Offline effect preview (software-rendered frames printed to the log; not part of the mod jar).
sourceSets {
	preview {
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

tasks.register('fxPreview', JavaExec) {
	dependsOn 'previewClasses'
	classpath = sourceSets.preview.runtimeClasspath
	mainClass = 'com.armageddon.client.fx.PreviewMain'
	args file('preview.txt').absolutePath, file('src/main/resources/assets/armageddon/textures/fx/atlas.png').absolutePath
	jvmArgs '-Djava.awt.headless=true'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

tasks.register('boneDump', JavaExec) {
	dependsOn 'previewClasses'
	classpath = sourceSets.preview.runtimeClasspath
	mainClass = 'com.armageddon.client.fx.BoneDump'
	args project.findProperty('dumpDir') ?: 'build'
}
