# Builds the mod jar on every push / pull request.
name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle (caches dependencies between runs)
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        # Maven Central sometimes rate-limits the shared runners (HTTP 429); only that is retried, after a pause.
        run: |
          for attempt in 1 2 3; do
            ./gradlew build --stacktrace 2>&1 | tee build.log
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ] || ! grep -q "status code 429" build.log; then
              exit "$code"
            fi
            echo "Rate-limited by a dependency repository (attempt $attempt); retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          exit "$code"
        shell: bash
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Armageddon-Arsenal
          path: build/libs/
      - name: effect preview frames
        continue-on-error: true
        run: ./gradlew fxPreview -q
      - name: publish preview frames
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/fx-previews && cd build/fx-previews
          git init -q
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "fx previews for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/fx-previews/latest
      - name: compile errors
        if: failure()
        run: |
          grep -E 'error:|\.java:[0-9]+:' build.log | head -60 || true
